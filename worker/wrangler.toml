[triggers]
crons = ["0 9 * * *", "* * * * *"]

[vars]
# URL raw de curadas/frases.json en GitHub.
CURADAS_URL = "https://raw.githubusercontent.com/LaburoDigital/motivacion/main/curadas/frases.json"
